name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🎯 选择 Xcode（15 优先）
        run: |
          XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: 🔧 修复源码
        run: |
          python3 << 'PYEOF'
          with open('Huati/Core/AppModel.swift', 'r') as f:
              content = f.read()
          
          old = '''{ [weak self] _ in
                    Task { @MainActor in
                        guard let self else { return }'''
          
          new = '''{ [weak self] _ in
                    guard let self else { return }
                    Task { @MainActor [self] in'''
          
          if old in content:
              content = content.replace(old, new)
              with open('Huati/Core/AppModel.swift', 'w') as f:
                  f.write(content)
              print("✅ 源码修复完成")
          else:
              print("⚠️ 未找到目标代码，跳过修复")
          PYEOF

      - name: 🔨 编译
        run: |
          set -e
          xcodebuild archive \
            -project Huati.xcodeproj \
            -scheme Huati \
            -configuration Release \
            -sdk iphoneos \
            -archivePath ./build/Huati.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0 \
            PRODUCT_BUNDLE_IDENTIFIER=com.myname.huati

          if [ ! -d "./build/Huati.xcarchive" ]; then
            echo "❌ Archive 失败"
            exit 1
          fi
          echo "✅ Archive 成功"

      - name: 📦 打包 IPA
        run: |
          cd ./build/Huati.xcarchive/Products
          cp -R Applications Payload && zip -qr Huati.ipa Payload && mv Huati.ipa ../../Huati-unsigned.ipa
          cd ../..
          echo "✅ IPA: $(ls -lh Huati-unsigned.ipa | awk '{print $5}')"

      - name: 📤 上传
        uses: actions/upload-artifact@v4
        with:
          name: Huati-unsigned-IPA
          path: ./Huati-unsigned.ipa
          retention-days: 7
