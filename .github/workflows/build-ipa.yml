name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode Scheme 名称（默认 Huati）'
        required: false
        default: 'Huati'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🔍 检查文件结构
        run: |
          echo "===== Huati/UI 目录 ====="
          ls -la Huati/UI/ 2>/dev/null || echo "❌ 目录不存在"
          echo ""
          echo "===== 所有 .swift 文件 ====="
          find . -name "*.swift" | sort

      - name: 🎯 选择 Xcode 版本
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            echo "❌ 找不到 Xcode"
            exit 1
          fi
          echo "✅ 使用: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: 🔧 初始化 Xcode（安装 iOS 平台）
        run: |
          echo ">> 安装 iOS 平台支持（可能需要 2-3 分钟）..."
          sudo xcodebuild -downloadPlatform iOS 2>&1 | tail -5
          echo ">> 验证平台安装..."
          ls /Applications/Xcode_16.app/Contents/Developer/Platforms/iPhoneOS.platform/DeviceSupport/ 2>/dev/null || echo "⚠️ 平台目录仍异常"


      - name: 📋 列出 Scheme
        run: xcodebuild -list -project Huati.xcodeproj

      - name: 🔨 编译 Archive
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          echo ">> Scheme: $SCHEME"
          xcodebuild archive -project Huati.xcodeproj -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath ./build/Huati.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0
          if [ ! -d "./build/Huati.xcarchive" ]; then
            echo "❌ Archive 失败"
            exit 1
          fi
          echo "✅ Archive 成功"

      - name: 📦 打包 IPA
        run: |
          cd ./build/Huati.xcarchive/Products
          cp -R Applications Payload
          zip -qr Huati.ipa Payload
          mv Huati.ipa ../../Huati-unsigned.ipa
          cd ../..
          echo "✅ IPA 打包完成: $(ls -lh Huati-unsigned.ipa | awk '{print $5}')"

      - name: 📤 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Huati-unsigned-IPA
          path: ./Huati-unsigned.ipa
          retention-days: 7
