name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🎯 选择 Xcode（15 优先）
        run: |
          XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -1)
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: 🔍 诊断：查看问题代码
        run: |
          echo "===== pbxproj 中的 SWIFT_STRICT_CONCURRENCY ====="
          grep -n "SWIFT_STRICT_CONCURRENCY" Huati.xcodeproj/project.pbxproj || echo "(未设置)"
          echo ""
          echo "===== AppModel.swift 第 90-100 行 ====="
          sed -n '90,100p' Huati/Core/AppModel.swift

      - name: 🔧 修复 AppModel.swift 并发问题
        run: |
          python3 << 'PYEOF'
          with open('Huati/Core/AppModel.swift', 'r') as f:
              lines = f.readlines()
          
          # 第93行（0-based:92）是 Timer 闭包 { [weak self] _ in
          # 第94行（0-based:93）是 Task { @MainActor in  
          # 第95行（0-based:94）是 guard let self else { return }
          
          # 在 Timer 闭包后插入 guard
          lines.insert(93, '            guard let self else { return }\n')
          # Task 行现在在 94（0-based）
          lines[94] = lines[94].replace('Task { @MainActor in', 'Task { @MainActor [self] in')
          # 删除原来的 guard 行（现在在 95，0-based）
          del lines[95]
          
          with open('Huati/Core/AppModel.swift', 'w') as f:
              f.writelines(lines)
          print("✅ 源码修复完成")
          PYEOF


      - name: 🔨 编译
        run: |
          xcodebuild archive -project Huati.xcodeproj -scheme Huati -configuration Release -sdk iphoneos -archivePath ./build/Huati.xcarchive -xcconfig disable_concurrency.xcconfig CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0
          if [ ! -d "./build/Huati.xcarchive" ]; then echo "❌ Archive 失败" && exit 1; fi
          echo "✅ Archive 成功"



      - name: 📦 打包 IPA
        run: |
          cd ./build/Huati.xcarchive/Products
          cp -R Applications Payload
          zip -qr Huati.ipa Payload
          mv Huati.ipa ../../Huati-unsigned.ipa
          cd ../..
          echo "✅ IPA: $(ls -lh Huati-unsigned.ipa | awk '{print $5}')"

      - name: 📤 上传
        uses: actions/upload-artifact@v4
        with:
          name: Huati-unsigned-IPA
          path: ./Huati-unsigned.ipa
          retention-days: 7
