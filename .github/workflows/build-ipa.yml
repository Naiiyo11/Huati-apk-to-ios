name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode Scheme 名称（默认 Huati）'
        required: false
        default: 'Huati'

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 拉取代码
        uses: actions/checkout@v4

      - name: 🎯 选择 Xcode + 安装缺失平台
        run: |
          # 优先 Xcode 15
          XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | tail -1)
          if [ -z "$XCODE" ]; then
            echo ">> Xcode 15 不可用，使用 Xcode 16 并安装 iOS 平台..."
            XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -1)
            sudo xcode-select -s "$XCODE/Contents/Developer"
            sudo xcodebuild -downloadPlatform iOS
          else
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version



      - name: 📋 列出 Scheme
        run: xcodebuild -list -project Huati.xcodeproj

      # ===== 关键修复：替换有问题的 LaunchScreen.storyboard =====
      - name: 🔧 替换 LaunchScreen.storyboard
        run: |
          STORYBOARD_PATH="Huati/LaunchScreen.storyboard"
          
          # 备份原文件
          cp "$STORYBOARD_PATH" "${STORYBOARD_PATH}.bak"
          
          # 生成一个最简单、兼容的 LaunchScreen
          cat > "$STORYBOARD_PATH" << 'STORYEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="23504" targetRuntime="AppleSDK" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" useTraitCollections="YES" useSafeAreas="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="23502"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <subviews>
                                      <label opaque="NO" clipsSubviews="YES" userInteractionEnabled="NO" contentMode="left" horizontalHuggingPriority="251" verticalHuggingPriority="750" text="华理跑步姬" textAlignment="center" lineBreakMode="middleTruncation" baselineAdjustment="alignBaselines" minimumFontSize="18" translatesAutoresizingMaskIntoConstraints="NO" id="GJd-Yh-RWb">
                                          <rect key="frame" x="96.666666666666671" y="410" width="200" height="32"/>
                                          <fontDescription key="fontDescription" type="boldSystem" pointSize="26"/>
                                          <color key="textColor" red="0.2" green="0.4" blue="0.6" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                          <nil key="highlightedColor"/>
                                      </label>
                                  </subviews>
                                  <viewLayoutGuide key="safeArea" id="Bcu-3y-fUS"/>
                                  <color key="backgroundColor" red="0.95" green="0.96" blue="0.98" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                                  <constraints>
                                      <constraint firstItem="GJd-Yh-RWb" firstAttribute="centerX" secondItem="Ze5-6b-2t3" secondAttribute="centerX" id="Q3B-4B-g5h"/>
                                      <constraint firstItem="GJd-Yh-RWb" firstAttribute="centerY" secondItem="Ze5-6b-2t3" secondAttribute="centerY" id="moa-c2-u7t"/>
                                  </constraints>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          STORYEOF
          
          echo "✅ LaunchScreen.storyboard 已替换为兼容版本"
          echo "   原文件备份: ${STORYBOARD_PATH}.bak"

      - name: 🔨 编译 Archive
        run: |
          SCHEME="${{ github.event.inputs.scheme }}"
          echo ">> Scheme: $SCHEME"
          xcodebuild archive -project Huati.xcodeproj -scheme "$SCHEME" -configuration Release -sdk iphoneos -archivePath ./build/Huati.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO SWIFT_VERSION=5.0
          if [ ! -d "./build/Huati.xcarchive" ]; then
            echo "❌ Archive 失败"
            exit 1
          fi
          echo "✅ Archive 成功"

      - name: 📦 打包 IPA
        run: |
          cd ./build/Huati.xcarchive/Products
          cp -R Applications Payload
          zip -qr Huati.ipa Payload
          mv Huati.ipa ../../Huati-unsigned.ipa
          cd ../..
          echo "✅ IPA 打包完成: $(ls -lh Huati-unsigned.ipa | awk '{print $5}')"

      - name: 📤 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Huati-unsigned-IPA
          path: ./Huati-unsigned.ipa
          retention-days: 7
